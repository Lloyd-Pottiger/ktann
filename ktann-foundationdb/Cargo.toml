[package]
name = "ktann-foundationdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "FoundationDB storage adapter for KTANN"
readme = "README.md"

[dependencies]
bytes = "1"
foundationdb = { version = "0.9.2", default-features = false, features = ["embedded-fdb-include", "fdb-7_3"] }
futures-util = "0.3"
ktann = { path = ".." }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
