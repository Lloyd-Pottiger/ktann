[package]
name = "ktann-benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Reproducible whole-system performance baselines for KTANN"

[[bin]]
name = "ktann-bench"
path = "src/main.rs"

[features]
default = ["rocksdb"]
rocksdb = ["dep:ktann-rocksdb", "dep:rocksdb"]
foundationdb = ["dep:foundationdb", "dep:foundationdb-sys", "dep:ktann-foundationdb"]

[dependencies]
bytes = "1"
arrow-array = "54"
foundationdb = { version = "0.9.2", default-features = false, features = ["embedded-fdb-include", "fdb-7_3"], optional = true }
foundationdb-sys = { version = "0.9.1", default-features = false, features = ["embedded-fdb-include", "fdb-7_3"], optional = true }
ktann = { path = ".." }
ktann-foundationdb = { path = "../ktann-foundationdb", optional = true }
ktann-rocksdb = { path = "../ktann-rocksdb", optional = true }
libc = "0.2"
md-5 = "0.10"
metrics = "0.24"
metrics-util = "0.20"
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd"] }
rocksdb = { version = "0.24", default-features = false, features = ["bindgen-runtime"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
