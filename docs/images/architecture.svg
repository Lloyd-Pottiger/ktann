<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title description">
<title id="title">KTANN system architecture</title>
<desc id="description">An application embeds KTANN Runtime and Index. Search reads one consistent snapshot. Foreground Mutations atomically update records and membership. Structure Maintenance commits searchable splits and merges. Bulk Build prepares artifacts from an immutable Input Snapshot, loads and validates a hidden index, then publishes it. All paths use the shared storage contract with a selected Memory, RocksDB, or FoundationDB backend. Source records and index data live together in that backend.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>
text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #203047; }
.title { font-size: 26px; font-weight: 700; }
.heading { font-size: 19px; font-weight: 700; }
.body { font-size: 16px; }
.small { font-size: 14px; fill: #526277; }
.line { fill: none; stroke: #64748b; stroke-width: 2; }
</style>
<rect width="1200" height="890" rx="16" fill="#ffffff"/>

