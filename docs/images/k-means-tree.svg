<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title description">
<title id="title">KTANN K-means tree</title>
<desc id="description">One tree within a Logical Index. Root Partition 1 routes to internal Partitions 2 and 3 using child centroids. They route to Leaf Partitions 4 through 7. Each leaf contains two Leaf Entries identifying Vector Records. Two-dimensional coordinates illustrate the hierarchy.</desc>
