text { font-family: Arial, Helvetica, sans-serif; fill: #203047; text-anchor: middle; }
.title { font-size: 26px; font-weight: 700; }
.heading { font-size: 18px; font-weight: 700; }
.body { font-size: 16px; }
.small { font-size: 14px; fill: #526277; }
.edge { fill: none; stroke: #77879b; stroke-width: 2; }
</style>
