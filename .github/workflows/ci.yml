name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/ci-scope.py "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test CI path and link checks
        run: python3 .github/scripts/test-ci.py
      - name: Check local documentation links
        run: python3 .github/scripts/check-docs.py

  test:
    name: Test (stable)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-core-stable-v1
      - name: Test core, Memory, and USearch
        run: >-
          cargo +stable test --workspace --all-targets
          --exclude ktann-rocksdb --exclude ktann-foundationdb --exclude ktann-benchmarks
      - name: Test Memory without test controls, including quick start
        run: cargo +stable test -p ktann-memory

  rocksdb:
    name: RocksDB integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Let tests and rustdoc share native dependency build scripts.
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: 2
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-rocksdb-stable-v1
      - name: Install FoundationDB client for workspace documentation
        run: .github/scripts/setup-foundationdb.sh client
      - name: Test RocksDB and benchmark tools
        run: cargo +stable test -p ktann-rocksdb -p ktann-benchmarks --all-targets
      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo +stable doc --workspace --all-features --no-deps
      - name: Remove generated documentation before cache cleanup
        # rust-cache mistakes rustdoc source directories named tests for build artifacts.
        run: cargo +stable clean --doc
      - name: Run RocksDB benchmark smoke profile including lifecycle
        run: >-
          cargo +stable run -p ktann-benchmarks --bin ktann-bench --
          run --backend rocksdb --profile smoke --worker-threads 2
          --output "${{ runner.temp }}/rocksdb-smoke.json"
      - name: Upload RocksDB benchmark smoke report
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb-smoke
          path: ${{ runner.temp }}/rocksdb-smoke.json
      - name: Write RocksDB durability probe
        env:
          KTANN_ROCKSDB_DURABILITY_PHASE: write
          KTANN_ROCKSDB_DURABILITY_PATH: ${{ runner.temp }}/ktann-rocksdb-durability
        run: >-
          cargo +stable test -p ktann-rocksdb
          --test rocksdb_durability -- --ignored
      - name: Verify RocksDB durability probe in a fresh process
        env:
          KTANN_ROCKSDB_DURABILITY_PHASE: verify
          KTANN_ROCKSDB_DURABILITY_PATH: ${{ runner.temp }}/ktann-rocksdb-durability
        run: >-
          cargo +stable test -p ktann-rocksdb
          --test rocksdb_durability -- --ignored

  foundationdb:
    name: FoundationDB integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-foundationdb-stable-v1
      - name: Set up FoundationDB
        run: .github/scripts/setup-foundationdb.sh server
      - name: Test FoundationDB without a cluster requirement
        run: cargo +stable test -p ktann-foundationdb --all-targets
      - name: Test FoundationDB adapter
        run: >-
          cargo +stable test -p ktann-foundationdb
          --test foundationdb_adapter --test foundationdb_faults
          --test foundationdb_verify --test foundationdb_observability
          --test foundationdb_bulk_load --test foundationdb_bulk_scheduler
          --test foundationdb_recall --test foundationdb_graph_atomic_size -- --ignored
      - name: Run FoundationDB benchmark smoke profile including lifecycle
        run: >-
          cargo +stable run -p ktann-benchmarks
          --no-default-features --features foundationdb --bin ktann-bench --
          run --backend foundationdb --profile smoke --worker-threads 2
          --output "${{ runner.temp }}/foundationdb-smoke.json"
      - name: Upload FoundationDB benchmark smoke report
        uses: actions/upload-artifact@v4
        with:
          name: foundationdb-smoke
          path: ${{ runner.temp }}/foundationdb-smoke.json
      - name: Write FoundationDB durability probe
        env:
          KTANN_FDB_DURABILITY_PHASE: write
        run: >-
          cargo +stable test -p ktann-foundationdb
          --test foundationdb_durability -- --ignored
      - name: Restart FoundationDB
        run: .github/scripts/setup-foundationdb.sh restart
      - name: Verify FoundationDB durability probe
        env:
          KTANN_FDB_DURABILITY_PHASE: verify
        run: >-
          cargo +stable test -p ktann-foundationdb
          --test foundationdb_durability -- --ignored

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
