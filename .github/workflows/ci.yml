name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.85.0, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - name: Check workspace
        run: cargo +"${{ matrix.toolchain }}" check --workspace --all-targets
      - name: Test workspace
        run: cargo +"${{ matrix.toolchain }}" test --workspace --all-targets

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
