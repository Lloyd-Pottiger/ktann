name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.85.0, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.toolchain }}
      - name: Install FoundationDB client
        run: .github/scripts/setup-foundationdb.sh client
      - name: Test workspace
        run: cargo +"${{ matrix.toolchain }}" test --workspace --all-targets
      - name: Check public documentation
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: >-
          cargo +"${{ matrix.toolchain }}" doc --workspace --all-features
          --no-deps
      - name: Run RocksDB benchmark smoke profile including lifecycle
        if: matrix.toolchain == 'stable'
        run: >-
          cargo +stable run -p ktann-benchmarks --bin ktann-bench --
          run --backend rocksdb --profile smoke --worker-threads 2
          --output "${{ runner.temp }}/rocksdb-smoke.json"
      - name: Upload RocksDB benchmark smoke report
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb-smoke
          path: ${{ runner.temp }}/rocksdb-smoke.json
      - name: Write RocksDB durability probe
        env:
          KTANN_ROCKSDB_DURABILITY_PHASE: write
          KTANN_ROCKSDB_DURABILITY_PATH: ${{ runner.temp }}/ktann-rocksdb-durability
        run: >-
          cargo +"${{ matrix.toolchain }}" test -p ktann-rocksdb
          --test rocksdb_durability -- --ignored
      - name: Verify RocksDB durability probe in a fresh process
        env:
          KTANN_ROCKSDB_DURABILITY_PHASE: verify
          KTANN_ROCKSDB_DURABILITY_PATH: ${{ runner.temp }}/ktann-rocksdb-durability
        run: >-
          cargo +"${{ matrix.toolchain }}" test -p ktann-rocksdb
          --test rocksdb_durability -- --ignored

  foundationdb:
    name: FoundationDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Set up FoundationDB
        run: .github/scripts/setup-foundationdb.sh server
      - name: Test FoundationDB adapter
        run: >-
          cargo +stable test -p ktann-foundationdb
          --test foundationdb_adapter --test foundationdb_faults
          --test foundationdb_verify --test foundationdb_observability
          --test foundationdb_recall -- --ignored
      - name: Run FoundationDB benchmark smoke profile including lifecycle
        run: >-
          cargo +stable run -p ktann-benchmarks
          --no-default-features --features foundationdb --bin ktann-bench --
          run --backend foundationdb --profile smoke --worker-threads 2
          --output "${{ runner.temp }}/foundationdb-smoke.json"
      - name: Upload FoundationDB benchmark smoke report
        uses: actions/upload-artifact@v4
        with:
          name: foundationdb-smoke
          path: ${{ runner.temp }}/foundationdb-smoke.json
      - name: Write FoundationDB durability probe
        env:
          KTANN_FDB_DURABILITY_PHASE: write
        run: >-
          cargo +stable test -p ktann-foundationdb
          --test foundationdb_durability -- --ignored
      - name: Restart FoundationDB
        run: .github/scripts/setup-foundationdb.sh restart
      - name: Verify FoundationDB durability probe
        env:
          KTANN_FDB_DURABILITY_PHASE: verify
        run: >-
          cargo +stable test -p ktann-foundationdb
          --test foundationdb_durability -- --ignored

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --all-features -- -D warnings
