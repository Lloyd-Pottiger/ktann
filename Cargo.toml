[workspace]
members = ["benchmarks", "ktann-foundationdb", "ktann-memory", "ktann-rocksdb"]
resolver = "3"

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Lloyd-Pottiger/ktann"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[package]
name = "ktann"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
description = "K-means Tree Approximate Nearest Neighbor library"

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]
bytes = "1"
getrandom = { version = "0.3", features = ["std"] }
metrics = "0.24"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }

[dev-dependencies]
ktann-memory = { path = "ktann-memory", features = ["test-support"] }
metrics-util = "0.20"
num-bigint = "0.4"
proptest = "1"
tracing-subscriber = "0.3"

[lints]
workspace = true
