[workspace]
members = ["ktann-foundationdb", "ktann-rocksdb"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Lloyd-Pottiger/ktann"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[package]
name = "ktann"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "K-means Tree Approximate Nearest Neighbor library"

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]
bytes = "1"
metrics = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }

[dev-dependencies]
metrics-util = "0.20"
num-bigint = "0.4"
proptest = "1"
tracing-subscriber = "0.3"

[lints]
workspace = true
